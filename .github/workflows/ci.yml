name: CI

on:
  push:
    branches: [main, dev]
  pull_request:
  workflow_dispatch:

# A second push to the same branch cancels the first. Nothing here needs to finish twice.
#
# Except on main, where a release gate is watching. A tag is cut on a main commit, and the release
# workflow refuses to build until this run concludes `success` on that exact SHA -- so cancelling
# it because another commit landed a minute later would fail the release for a reason that has
# nothing to do with the release. Grouping main by SHA means each commit's run is its own group and
# survives; branches and pull requests still collapse to the newest push.
#
# And on dev, where dev-build.yml's gate waits on this run for the same reason. There the running
# CI is left to finish and pushes queue behind it: GitHub keeps only the newest pending run per
# group, so five quick pushes run CI on the first and then on the fifth, and the dev builds for
# those two commits each find a concluded run to read.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref == 'refs/heads/main' && github.sha || github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/dev' }}

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  rust:
    name: Rust
    runs-on: ubuntu-24.04
    # No debug info in CI's test builds: nothing here runs a debugger, and panics report their
    # location without it. At `opt-level = 2` it was a quarter of the test build's compile time
    # (and the bulk of the cache). Local builds keep the profile as Cargo.toml declares it.
    env:
      CARGO_PROFILE_DEV_DEBUG: 0
    steps:
      - uses: actions/checkout@v5

      # Cheap and first: four files declare the release version and nothing else makes them agree.
      - run: ./scripts/check-versions.sh
      - run: ./scripts/check-arch-digests.sh

      # Exercises the bundle post-processing against fixtures. In particular, the AppImage must
      # launch its bundled binary rather than an installed /usr/bin/tennoscope that can mask a
      # broken artifact on a maintainer workstation.
      - run: ./scripts/test-build-linux-bundles.sh

      # Guard the local cross-target preflight and the Arch check() contract themselves. Both are
      # cheap shell harnesses: Cargo/pnpm are replaced with recorders, so no second build occurs.
      - run: ./scripts/test-check-windows.sh
      - run: ./scripts/test-arch-pkgbuild.sh
      - run: ./scripts/test-capabilities.sh
      # Updater feed generation is fail-closed shell + stdlib python; the verify
      # twin needs pynacl for the Ed25519 checks (same as the release job).
      - run: ./scripts/test-build-update-feed.sh
      - run: pip install --break-system-packages pynacl && ./scripts/test-verify-update-feed.sh

      # Tauri's Linux system libraries plus tesseract. Screen capture and the crop pipeline are
      # Rust now, so tesseract is the only thing the OCR tests still shell out to.
      #
      # The block after libssl is xcap's, not ours. Its Linux capture path links EGL, gbm, wayland
      # and xcb, depends on pipewire unconditionally for the portal route, and generates bindings
      # with bindgen (hence clang). None of it is optional, and a developer machine running a
      # desktop already has every one -- which is why their absence showed up on a runner and not
      # in review. The list is the `-l` flags off the failing link line, not a guess.
      - name: Install system dependencies
        uses: ./.github/actions/apt-install
        with:
          packages: >-
            libwebkit2gtk-4.1-dev
            libgtk-3-dev
            libayatana-appindicator3-dev
            librsvg2-dev
            libxdo-dev
            libssl-dev
            libpipewire-0.3-dev
            libclang-dev
            libgbm-dev
            libegl-dev
            libwayland-dev
            libxcb1-dev
            tesseract-ocr
            tesseract-ocr-eng

      # No toolchain action: rust-toolchain.toml pins the channel and components, and rustup on
      # the runner installs it on the first cargo call. One source of truth for the version.
      - uses: Swatinem/rust-cache@v2
        with:
          # Names the cache after the platform instead of the job id. The release builds do not
          # read it: these are debug builds, and release-cache.yml warms theirs.
          shared-key: linux

      - run: cargo fmt --all --check
      - run: cargo clippy --workspace --all-targets -- -D warnings
      - run: cargo test --workspace

  # The Windows half of the port is invisible to the job above: `cfg(windows)` code is not compiled
  # by a Linux clippy run, so without this leg the Windows backends are never built by anything.
  # It is the only verification vehicle for them -- there is no Windows machine behind this project.
  windows:
    name: Rust (Windows)
    runs-on: windows-latest
    # See the Linux job. Linking PDBs made this the slowest job in CI, and so the slowest step
    # between a dev push and its beta build.
    env:
      CARGO_PROFILE_DEV_DEBUG: 0
    steps:
      - uses: actions/checkout@v5

      - name: Test transient download recovery
        run: ./scripts/test-download-with-retry.ps1
        shell: pwsh

      # The reward tests shell out to tesseract on every platform. Windows gets the same portable
      # UB-Mannheim build the installer bundles -- scripts/vendor-windows-tesseract.ps1 -- rather
      # than a Chocolatey package, which makes CI read through the engine players actually run.
      # It also sidesteps community.chocolatey.org: on 2026-08-21 it answered choco's resolver
      # with 504s, choco reported "installed 0/0 packages", exited 0 anyway, and the job spent
      # ten minutes building before eight reward tests failed with "tesseract is not available".
      #
      # A step already running never sees a PATH edit -- every later step inherits the environment
      # captured when the job started -- so $GITHUB_PATH is the one that reaches the tests. They
      # resolve bare `tesseract` off it with no resource directory, so the OCR path cannot hand
      # the engine --tessdata-dir; TESSDATA_PREFIX is what sends it to the training data sitting
      # beside the executable.
      - name: Vendor tesseract
        run: ./scripts/vendor-windows-tesseract.ps1
        shell: pwsh

      - name: Put tesseract on PATH
        run: |
          $vendor = Resolve-Path "app/src-tauri/vendor/tesseract"
          "$vendor" >> $env:GITHUB_PATH
          "TESSDATA_PREFIX=$vendor" >> $env:GITHUB_ENV
        shell: pwsh

      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: windows
      - run: cargo clippy --workspace --all-targets -- -D warnings
      - run: cargo test --workspace

  # Validates what the updater and the Winget track ship: the manifests must
  # pass winget's own validator on a real Windows runner (the format is
  # Microsoft's, so only their tool can bless it). The local Windows VM proved
  # the packaged installer itself: silent per-user install, no elevation.
  packaging:
    name: Packaging
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5

      - name: Validate winget manifests
        # Directory form: winget assembles the version + installer + locale
        # set itself. Keep this directory manifest-only -- any README here
        # breaks validation (winget rejects it as a rootless manifest).
        run: winget validate --manifest packaging/winget

  frontend:
    name: Frontend
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5

      # The pnpm version lives in app/package.json, not at the repo root, so the action has to be
      # pointed at it or it finds nothing to install.
      - uses: pnpm/action-setup@v5
        with:
          package_json_file: app/package.json

      - uses: actions/setup-node@v5
        with:
          node-version-file: app/.node-version
          cache: pnpm
          cache-dependency-path: app/pnpm-lock.yaml

      - run: pnpm install --frozen-lockfile
        working-directory: app

      # oxlint, then tsc --noEmit, then vitest. Same command a contributor runs locally.
      - run: pnpm check
        working-directory: app
