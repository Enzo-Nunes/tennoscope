name: Dev build

# Every push to `dev` that passes CI becomes a signed AppImage published as a GitHub prerelease
# (`v0.15.0-dev.N`), and the beta updater feed is pointed at it. Installs with Settings ->
# Updates -> Pre-releases -> "Get beta builds" switched on follow these; stable installs read
# `latest.json`, which nothing here touches.
#
# The tag is created by this workflow through GITHUB_TOKEN, and pushes made with that token
# start no workflows -- so `release.yml`, which runs on `v*` tags, never sees these.
on:
  push:
    branches: [dev]
  workflow_dispatch:

# One build at a time, and never cancelled: on a busy day dev moves every few minutes, and
# cancelling on each push meant no build ever got far enough to publish. GitHub keeps only the
# newest pending run per group, so pushes that land mid-build collapse into one follow-up build.
concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: false

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  # Same gate as release.yml: wait for CI on this exact commit and require all four jobs green.
  # Keep the job names in step with ci.yml, as there. It runs beside the build rather than ahead
  # of it, so a push costs the slower of CI and the build instead of the two added together; only
  # publishing waits for it.
  gate:
    name: Require a green CI
    if: github.ref == 'refs/heads/dev'
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      checks: read
    steps:
      - name: Wait for CI on this commit
        uses: lewagon/wait-on-check-action@2271c86c146b96545b4e871b855e10ffa6f50773 # v1.9.0
        with:
          ref: ${{ github.sha }}
          repo-token: ${{ secrets.GITHUB_TOKEN }}
          check-regexp: ^(Rust|Rust \(Windows\)|Frontend|Packaging)$
          allowed-conclusions: success
          wait-interval: 20
          checks-discovery-timeout: 300

      - name: CI gated on every job it should have
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          expected=4
          found=$(gh api "repos/${GITHUB_REPOSITORY}/commits/${GITHUB_SHA}/check-runs" \
            --paginate --jq '.check_runs[]
              | select(.name | test("^(Rust|Rust \\(Windows\\)|Frontend|Packaging)$"))
              | select(.conclusion == "success")
              | .name' | sort -u | wc -l)
          if [ "$found" -ne "$expected" ]; then
            echo "gated on $found CI jobs, expected $expected -- was a job in ci.yml renamed?" >&2
            exit 1
          fi
          echo "gated on all $expected CI jobs"

  # The AppImage half of release.yml's `appimage` job: same jammy runner and the same pinned
  # PipeWire, for the reasons given there. Keep the two in step. Only the AppImage is built,
  # because it is the only Linux artifact the updater can replace in place.
  appimage:
    name: Dev AppImage
    if: github.ref == 'refs/heads/dev'
    runs-on: ubuntu-22.04
    # The signing key lives in this environment: `tauri build` signs as it bundles.
    environment: release
    # Builds and signs only. Publishing is the `publish` job's, behind the CI gate.
    permissions:
      contents: read
    outputs:
      version: ${{ steps.stamp.outputs.version }}
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      GH_REPO: ${{ github.repository }}
    steps:
      - uses: actions/checkout@v5

      # Its own cache, not CI's: CI saves debug builds made on 24.04, and nothing in those is
      # reusable by a release build on jammy, so every dev build compiled all ~600 crates from
      # scratch (7.5 minutes). Restored before the version is stamped, because the key hashes
      # Cargo.toml and Cargo.lock: after stamping they change every run, the key would never
      # hit, and every run would upload a fresh copy. Workspace crates are left out of the cache
      # by rust-cache itself, so only the app's own crates rebuild.
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: dev-appimage
          # Only dev saves. The beta channel is the sole reader, and a stray branch run must not
          # evict this entry.
          save-if: ${{ github.ref == 'refs/heads/dev' }}

      # The binary has to report its own dev version: the updater compares the feed against it,
      # so a build that said 0.14.0 would be offered every dev build forever, including itself.
      # The base is the workspace version once dev has been bumped past the last release, and
      # the next minor until then. "Released" counts the tag, not just a published release:
      # between pushing `v0.15.0` and publishing its draft, dev already carries 0.16 work, and
      # a build stamped 0.15.0-dev.N would sort below 0.15.0 and be replaced by it. The run number makes each build newer than
      # the last (`-dev.10` sorts after `-dev.9`: semver compares numeric identifiers as
      # numbers).
      - name: Stamp the dev version
        id: stamp
        run: |
          set -eu
          workspace=$(sed -n 's/^version = "\(.*\)"$/\1/p' Cargo.toml | head -1)
          stable_tag=$(gh release list --exclude-pre-releases --exclude-drafts --limit 1 --json tagName --jq '.[0].tagName')
          if [ -z "$stable_tag" ]; then
            echo "no stable release found; the beta feed has nowhere to be served from" >&2
            exit 1
          fi
          released=${stable_tag#v}
          if gh api "repos/${GH_REPO}/git/ref/tags/v${workspace}" --silent 2>/dev/null; then
            released=$(printf '%s\n%s\n' "$workspace" "$released" | sort -V | tail -1)
          fi
          highest=$(printf '%s\n%s\n' "$workspace" "$released" | sort -V | tail -1)
          if [ "$highest" = "$released" ]; then
            major=${released%%.*}
            rest=${released#*.}
            minor=${rest%%.*}
            base="$major.$((minor + 1)).0"
          else
            base=$workspace
          fi
          version="$base-dev.${GITHUB_RUN_NUMBER}"
          # First match in each file is the declaration, as check-versions.sh reads them. The
          # PKGBUILDs are left alone: pkgver cannot hold a `-`, and no package is built here.
          sed -i "0,/^version = \".*\"$/s//version = \"$version\"/" Cargo.toml
          sed -i "0,/\"version\": *\".*\"/s//\"version\": \"$version\"/" app/src-tauri/tauri.conf.json
          sed -i "0,/\"version\": *\".*\"/s//\"version\": \"$version\"/" app/package.json
          grep -q "^version = \"$version\"$" Cargo.toml
          grep -q "\"version\": \"$version\"" app/src-tauri/tauri.conf.json
          grep -q "\"version\": \"$version\"" app/package.json
          echo "version=$version" >>"$GITHUB_OUTPUT"
          echo "building $version"

      # Everything but pipewire. Jammy's is 0.3.48, which predates `spa_meta_bitmap_is_valid`
      # becoming an inline function (pipewire 853c4783), and the libspa bindings this app
      # compiles against assume it is one. The pinned pipewire below installs
      # `libspa-0.2.pc`/`libpipewire-0.3.pc` into a private prefix, and the distro's stale copy
      # has to go: pkg-config would otherwise find it there (it drags `libspa-0.2-dev` in behind
      # it), and it is the copy the loader would answer with when linuxdeploy bundles. `rpm`
      # was the rpm bundle's inspector and this job builds only the AppImage. `gettext` is
      # pipewire's, not the app's: `subdir('po')` is not optional and needs msgfmt at configure
      # time.
      - name: Install system dependencies
        uses: ./.github/actions/apt-install
        with:
          packages: >-
            libwebkit2gtk-4.1-dev
            libgtk-3-dev
            libayatana-appindicator3-dev
            librsvg2-dev
            libxdo-dev
            libssl-dev
            libclang-dev
            libgbm-dev
            libegl-dev
            libwayland-dev
            libxcb1-dev
            libarchive-tools
            meson
            ninja-build
            gettext
            tesseract-ocr
            tesseract-ocr-eng

      - name: Build the PipeWire client libraries
        uses: ./.github/actions/pipewire

      - uses: pnpm/action-setup@v5
        with:
          package_json_file: app/package.json

      - uses: actions/setup-node@v5
        with:
          node-version-file: app/.node-version
          cache: pnpm
          cache-dependency-path: app/pnpm-lock.yaml

      - run: pnpm install --frozen-lockfile
        working-directory: app

      # `--skip-gates`: CI runs the test suite, clippy and `pnpm check` on this commit, and the
      # `publish` job will not release this build until it has passed. See release.yml.
      - run: ./scripts/build-linux-bundles.sh --skip-gates appimage
        env:
          # As a prerelease tag would: debug assertions on and the beta comparator baked in.
          CARGO_PROFILE_RELEASE_DEBUG_ASSERTIONS: true
          TENNOSCOPE_CHANNEL: beta
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ''

      # The bundle helper repacks the AppImage after `tauri build`; see release.yml.
      - name: Re-sign final AppImage
        working-directory: app
        run: |
          appimage=$(ls ../target/release/bundle/appimage/*.AppImage | grep -v '\.sig$' | head -1)
          pnpm tauri signer sign "$appimage" < /dev/null
          ls "$appimage.sig"
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ''

      # Flat, as the feed builder expects: the artifact roots at the common ancestor of its globs.
      - uses: actions/upload-artifact@v6
        with:
          name: dev-appimage
          path: |
            target/release/bundle/appimage/*.AppImage
            target/release/bundle/appimage/*.sig
          retention-days: 3

  # Nothing reaches the beta channel until CI has passed on this commit, even though the build
  # above ran without waiting for it.
  publish:
    name: Publish to the beta channel
    needs: [gate, appimage]
    runs-on: ubuntu-24.04
    # Writes the prerelease and the beta feed. No signing key here: the build job signed.
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      GH_REPO: ${{ github.repository }}
      VERSION: ${{ needs.appimage.outputs.version }}
    steps:
      - uses: actions/checkout@v5

      # Read again here rather than taken from the build: a release published while this
      # build ran moves `latest`, and the feed has to ride the release that serves it now. A
      # build that release has overtaken would only be replaced by it, so it is not published.
      - name: Find the release that serves the beta feed
        run: |
          set -eu
          stable_tag=$(gh release list --exclude-pre-releases --exclude-drafts --limit 1 --json tagName --jq '.[0].tagName')
          [ -n "$stable_tag" ] || { echo "no stable release found" >&2; exit 1; }
          stable=${stable_tag#v}
          # sort -V puts 0.15.0-dev.3 after 0.15.0, so compare the parts before the suffix.
          base=${VERSION%%-*}
          if [ "$(printf '%s\n%s\n' "$base" "$stable" | sort -V | tail -1)" = "$stable" ]; then
            echo "$VERSION is not newer than the published $stable_tag; refusing to publish it" >&2
            exit 1
          fi
          echo "STABLE_TAG=$stable_tag" >>"$GITHUB_ENV"

      - uses: actions/download-artifact@v7
        with:
          name: dev-appimage
          path: appimage

      - name: Build and verify the beta feed
        run: |
          ./scripts/build-update-feed.sh --version "$VERSION" --tag "v$VERSION" \
            --artifacts appimage --out feeds
          pip install --break-system-packages pynacl
          ./scripts/verify-update-feed.sh --feeds feeds --artifacts appimage \
            --tauri-conf app/src-tauri/tauri.conf.json --expect beta

      # Published, not a draft: a draft's download URLs do not resolve, and the feed points at
      # them. `make_latest: false` keeps the stable release as `latest`, which is what serves
      # both feeds.
      - name: Publish the prerelease
        uses: softprops/action-gh-release@v3
        with:
          tag_name: v${{ env.VERSION }}
          target_commitish: ${{ github.sha }}
          name: TennoScope v${{ env.VERSION }}
          body: Automatic build of `dev` at ${{ github.sha }}. Not a release; may break reward reads.
          prerelease: true
          make_latest: false
          fail_on_unmatched_files: true
          files: |
            appimage/*.AppImage
            appimage/*.sig
            feeds/latest-beta.json

      # The same move release.yml makes for an RC: `releases/latest/download` only ever serves
      # the newest stable release, so the beta feed is pinned onto it. `latest.json` is untouched.
      - name: Point the beta feed at this build
        run: gh release upload "$STABLE_TAG" feeds/latest-beta.json --clobber

      # Keep the three newest dev builds and their tags; older ones are dead weight nobody's
      # updater will ever be pointed at again.
      - name: Prune old dev builds
        run: |
          gh release list --limit 100 --json tagName,createdAt \
            --jq '[.[] | select(.tagName | test("^v[0-9.]+-dev\\.[0-9]+$"))] | sort_by(.createdAt) | reverse | .[3:] | .[].tagName' |
          while read -r tag; do
            echo "deleting $tag"
            gh release delete "$tag" --cleanup-tag --yes
          done
