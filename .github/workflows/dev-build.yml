name: Dev build

# Every push to `dev` that passes CI becomes a signed AppImage published as a GitHub prerelease
# (`v0.15.0-dev.N`), and the beta updater feed is pointed at it. Installs with Settings ->
# Updates -> Pre-releases -> "Get beta builds" switched on follow these; stable installs read
# `latest.json`, which nothing here touches.
#
# The tag is created by this workflow through GITHUB_TOKEN, and pushes made with that token
# start no workflows -- so `release.yml`, which runs on `v*` tags, never sees these.
on:
  push:
    branches: [dev]
  workflow_dispatch:

# A newer push supersedes an older build: only the newest dev build is worth publishing.
concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  # Same gate as release.yml: wait for CI on this exact commit and require all four jobs green.
  # Keep the job names in step with ci.yml, as there.
  gate:
    name: Require a green CI
    if: github.ref == 'refs/heads/dev'
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      checks: read
    steps:
      - name: Wait for CI on this commit
        uses: lewagon/wait-on-check-action@2271c86c146b96545b4e871b855e10ffa6f50773 # v1.9.0
        with:
          ref: ${{ github.sha }}
          repo-token: ${{ secrets.GITHUB_TOKEN }}
          check-regexp: ^(Rust|Rust \(Windows\)|Frontend|Packaging)$
          allowed-conclusions: success
          wait-interval: 20
          checks-discovery-timeout: 300

      - name: CI gated on every job it should have
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          expected=4
          found=$(gh api "repos/${GITHUB_REPOSITORY}/commits/${GITHUB_SHA}/check-runs" \
            --paginate --jq '.check_runs[]
              | select(.name | test("^(Rust|Rust \\(Windows\\)|Frontend|Packaging)$"))
              | select(.conclusion == "success")
              | .name' | sort -u | wc -l)
          if [ "$found" -ne "$expected" ]; then
            echo "gated on $found CI jobs, expected $expected -- was a job in ci.yml renamed?" >&2
            exit 1
          fi
          echo "gated on all $expected CI jobs"

  # The AppImage half of release.yml's `appimage` job: same jammy runner and the same pinned
  # PipeWire, for the reasons given there. Keep the two in step. Only the AppImage is built,
  # because it is the only Linux artifact the updater can replace in place.
  appimage:
    name: Dev AppImage
    needs: gate
    runs-on: ubuntu-22.04
    # The signing key lives in this environment. If its deployment branches are limited to
    # tags, `dev` has to be added there or this job never receives the secret.
    environment: release
    # Writes the prerelease and the beta feed.
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      GH_REPO: ${{ github.repository }}
    steps:
      - uses: actions/checkout@v5

      # The binary has to report its own dev version: the updater compares the feed against it,
      # so a build that said 0.14.0 would be offered every dev build forever, including itself.
      # The base is the workspace version once dev has been bumped past the last stable
      # release, and the next minor until then. The run number makes each build newer than
      # the last (`-dev.10` sorts after `-dev.9`: semver compares numeric identifiers as
      # numbers).
      - name: Stamp the dev version
        run: |
          set -eu
          workspace=$(sed -n 's/^version = "\(.*\)"$/\1/p' Cargo.toml | head -1)
          stable_tag=$(gh release list --exclude-pre-releases --exclude-drafts --limit 1 --json tagName --jq '.[0].tagName')
          if [ -z "$stable_tag" ]; then
            echo "no stable release found; the beta feed has nowhere to be served from" >&2
            exit 1
          fi
          stable=${stable_tag#v}
          highest=$(printf '%s\n%s\n' "$workspace" "$stable" | sort -V | tail -1)
          if [ "$workspace" = "$stable" ] || [ "$highest" = "$stable" ]; then
            major=${stable%%.*}
            rest=${stable#*.}
            minor=${rest%%.*}
            base="$major.$((minor + 1)).0"
          else
            base=$workspace
          fi
          version="$base-dev.${GITHUB_RUN_NUMBER}"
          # First match in each file is the declaration, as check-versions.sh reads them. The
          # PKGBUILDs are left alone: pkgver cannot hold a `-`, and no package is built here.
          sed -i "0,/^version = \".*\"$/s//version = \"$version\"/" Cargo.toml
          sed -i "0,/\"version\": *\".*\"/s//\"version\": \"$version\"/" app/src-tauri/tauri.conf.json
          sed -i "0,/\"version\": *\".*\"/s//\"version\": \"$version\"/" app/package.json
          grep -q "^version = \"$version\"$" Cargo.toml
          grep -q "\"version\": \"$version\"" app/src-tauri/tauri.conf.json
          grep -q "\"version\": \"$version\"" app/package.json
          echo "VERSION=$version" >>"$GITHUB_ENV"
          echo "STABLE_TAG=$stable_tag" >>"$GITHUB_ENV"
          echo "building $version (beta feed served from $stable_tag)"

      # Everything but pipewire. Jammy's is 0.3.48, which predates `spa_meta_bitmap_is_valid`
      # becoming an inline function (pipewire 853c4783), and the libspa bindings this app
      # compiles against assume it is one. The pinned pipewire below installs
      # `libspa-0.2.pc`/`libpipewire-0.3.pc` into a private prefix, and the distro's stale copy
      # has to go: pkg-config would otherwise find it there (it drags `libspa-0.2-dev` in behind
      # it), and it is the copy the loader would answer with when linuxdeploy bundles. `rpm`
      # was the rpm bundle's inspector and this job builds only the AppImage. `gettext` is
      # pipewire's, not the app's: `subdir('po')` is not optional and needs msgfmt at configure
      # time.
      - name: Install system dependencies
        uses: ./.github/actions/apt-install
        with:
          packages: >-
            libwebkit2gtk-4.1-dev
            libgtk-3-dev
            libayatana-appindicator3-dev
            librsvg2-dev
            libxdo-dev
            libssl-dev
            libclang-dev
            libgbm-dev
            libegl-dev
            libwayland-dev
            libxcb1-dev
            libarchive-tools
            meson
            ninja-build
            gettext
            tesseract-ocr
            tesseract-ocr-eng

      # 1.0.0 is the oldest 1.x release, which buys two things: it is past the inline-function
      # floor above, and it asks meson for >= 0.61.1, one jammy's own meson already satisfies --
      # so no pip toolchain has to appear on the runner to build it. `auto_features=disabled`
      # strips every `auto` dependency (udev, sdl2, sndfile, alsa, bluez5, x11, vulkan, jack,
      # avahi, libcamera ...). It does not touch options that default to *enabled*, so those are
      # disabled by hand: dbus pulls libdbus-1-dev, flatpak pulls glib, and the jack/v4l2/alsa
      # bridges build a library each that this job will never ship. `spa-plugins` must stay
      # enabled -- disabling it makes configure fail outright on an undefined
      # `audioconvert_dep`.
      #
      # What is left is headers the app compiles against plus the one library it links:
      # libspa stopped shipping a `.so` once its last function became an inline one, so
      # `libpipewire-0.3.so.0` is all there is to bundle. The daemon and the tools still compile,
      # against nothing but libc.
      #
      # The tarball is pinned by digest: a release must not take a binary dependency from a
      # URL that changed underneath it, and this one is served by an upstream GitLab rather
      # than a signed distribution repository.
      - name: Build the PipeWire client libraries
        env:
          PIPEWIRE_VERSION: '1.0.0'
          PIPEWIRE_SHA256: f91ef1d1161b37aae6e21b9671917d97097e2664c83d919ba3a0793d6fbc543d
        run: |
          set -eu
          archive="/tmp/pipewire-${PIPEWIRE_VERSION}.tar.gz"
          curl --fail --location --retry 3 --output "$archive" \
            "https://gitlab.freedesktop.org/pipewire/pipewire/-/archive/${PIPEWIRE_VERSION}/pipewire-${PIPEWIRE_VERSION}.tar.gz"
          echo "${PIPEWIRE_SHA256}  $archive" | sha256sum --check
          tar --extract --gzip --file "$archive" --directory /tmp
          cd "/tmp/pipewire-${PIPEWIRE_VERSION}"
          meson setup build --prefix="$HOME/pw/prefix" \
            -Dauto_features=disabled \
            -Ddbus=disabled \
            -Dflatpak=disabled \
            -Dpipewire-alsa=disabled \
            -Dpipewire-jack=disabled \
            -Dpipewire-v4l2=disabled \
            -Dexamples=disabled \
            -Dtests=disabled \
            -Dman=disabled \
            -Ddocs=disabled \
            '-Dsession-managers=[]'
          meson compile -C build
          meson install -C build
          # Ubuntu's meson patches libdir to the multiarch directory, so do not hardcode
          # `lib/x86_64-linux-gnu`: ask the installed tree where it actually landed.
          pc_dir=$(dirname "$(find "$HOME/pw/prefix" -name 'libspa-0.2.pc' -print -quit)")
          [ -f "$pc_dir/libspa-0.2.pc" ] || {
            echo "no libspa-0.2.pc was installed into $HOME/pw/prefix" >&2
            exit 1
          }
          lib_dir=$(dirname "$pc_dir")
          # pkg-config reads PKG_CONFIG_PATH ahead of the system directories, so the linker and
          # the bindgen build scripts see the prefix's headers and libraries.
          echo "PKG_CONFIG_PATH=$lib_dir/pkgconfig:${PKG_CONFIG_PATH:-}" >>"$GITHUB_ENV"
          # The .pc files are versioned by ABI, not by release (`libspa-0.2.pc` says
          # `Version: 0.2` on jammy and on 1.0.0 alike), so `--modversion` cannot tell the two
          # apart and only the include path can. Cheap to check, and the alternative is a
          # release built against headers the prefix was fetched to replace.
          cflags=$(PKG_CONFIG_PATH="$lib_dir/pkgconfig" pkg-config --cflags libspa-0.2)
          case "$cflags" in
            *"$HOME"/pw/prefix/*) ;;
            *) echo "libspa-0.2 resolves outside the pipewire prefix: $cflags" >&2; exit 1 ;;
          esac
          # linuxdeploy bundles whatever `ldd` resolves each NEEDED name to while it runs. Left
          # to itself the loader answers with the system 0.3.48 -- the very version the prefix
          # exists to replace -- so the AppImage would ship that `libpipewire-0.3.so.0` next to
          # a binary compiled against 1.0.0 headers.
          echo "LD_LIBRARY_PATH=$lib_dir:${LD_LIBRARY_PATH:-}" >>"$GITHUB_ENV"

      - uses: Swatinem/rust-cache@v2
        with:
          # Matches CI's `Rust` job. See release.yml for why builds here never save.
          shared-key: linux
          save-if: false

      - uses: pnpm/action-setup@v5
        with:
          package_json_file: app/package.json

      - uses: actions/setup-node@v5
        with:
          node-version-file: app/.node-version
          cache: pnpm
          cache-dependency-path: app/pnpm-lock.yaml

      - run: pnpm install --frozen-lockfile
        working-directory: app

      # `--skip-gates`: the gate job proved CI green on this commit. See release.yml.
      - run: ./scripts/build-linux-bundles.sh --skip-gates appimage
        env:
          # As a prerelease tag would: debug assertions on and the beta comparator baked in.
          CARGO_PROFILE_RELEASE_DEBUG_ASSERTIONS: true
          TENNOSCOPE_CHANNEL: beta
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ''

      # The bundle helper repacks the AppImage after `tauri build`; see release.yml.
      - name: Re-sign final AppImage
        working-directory: app
        run: |
          appimage=$(ls ../target/release/bundle/appimage/*.AppImage | grep -v '\.sig$' | head -1)
          pnpm tauri signer sign "$appimage" < /dev/null
          ls "$appimage.sig"
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ''

      - name: Build and verify the beta feed
        run: |
          ./scripts/build-update-feed.sh --version "$VERSION" --tag "v$VERSION" \
            --artifacts target/release/bundle/appimage --out feeds
          pip install --break-system-packages pynacl
          ./scripts/verify-update-feed.sh --feeds feeds --artifacts target/release/bundle/appimage \
            --tauri-conf app/src-tauri/tauri.conf.json --expect beta

      # Published, not a draft: a draft's download URLs do not resolve, and the feed points at
      # them. `make_latest: false` keeps the stable release as `latest`, which is what serves
      # both feeds.
      - name: Publish the prerelease
        uses: softprops/action-gh-release@v3
        with:
          tag_name: v${{ env.VERSION }}
          target_commitish: ${{ github.sha }}
          name: TennoScope v${{ env.VERSION }}
          body: Automatic build of `dev` at ${{ github.sha }}. Not a release; may break reward reads.
          prerelease: true
          make_latest: false
          fail_on_unmatched_files: true
          files: |
            target/release/bundle/appimage/*.AppImage
            target/release/bundle/appimage/*.sig
            feeds/latest-beta.json

      # The same move release.yml makes for an RC: `releases/latest/download` only ever serves
      # the newest stable release, so the beta feed is pinned onto it. `latest.json` is untouched.
      - name: Point the beta feed at this build
        run: gh release upload "$STABLE_TAG" feeds/latest-beta.json --clobber

      # Keep the three newest dev builds and their tags; older ones are dead weight nobody's
      # updater will ever be pointed at again.
      - name: Prune old dev builds
        run: |
          gh release list --limit 100 --json tagName,createdAt \
            --jq '[.[] | select(.tagName | test("^v[0-9.]+-dev\\.[0-9]+$"))] | sort_by(.createdAt) | reverse | .[3:] | .[].tagName' |
          while read -r tag; do
            echo "deleting $tag"
            gh release delete "$tag" --cleanup-tag --yes
          done
