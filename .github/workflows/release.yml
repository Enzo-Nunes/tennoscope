name: Release

# Releases are cut by hand: tag a commit `v0.1.0` and push the tag. Nothing here fires on a
# branch push, so merging to main never publishes anything.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always
  # A pre-release tag (`v0.4.2-rc1`) builds with debug assertions on. The `[DEBUG-…]` log
  # channel is always compiled now, and a debug build also prints to stdout and keeps the
  # remaining `cfg(debug_assertions)` site: the reward OCR's crop retention (`CROP_KEEP_BELOW`
  # keeps low-confidence crops on disk for forensics). Persistent logging always writes the
  # platform log directory regardless of this switch -- the tag only decides how much extra
  # debugging aid the binary carries.
  CARGO_PROFILE_RELEASE_DEBUG_ASSERTIONS: ${{ contains(github.ref_name, '-') }}

jobs:
  # The tag rides a commit that was pushed to main in the same breath, so when this workflow
  # starts CI has not finished -- usually has not started. Reading the check runs once would
  # therefore find nothing conclusive and wave the build through, which is worse than having no
  # gate at all, because it looks like one. This waits for a conclusion instead.
  gate:
    name: Require a green CI
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      checks: read
    steps:
      - uses: actions/checkout@v5

      # Pinned to a commit, not to `v1`: this action decides whether an untested build reaches
      # players, and a tag is a pointer its owner can move.
      - name: Wait for CI on this commit
        uses: lewagon/wait-on-check-action@2271c86c146b96545b4e871b855e10ffa6f50773 # v1.9.0
        with:
          ref: ${{ github.sha }}
          repo-token: ${{ secrets.GITHUB_TOKEN }}
          # Names CI's three jobs exactly, and nothing else. This workflow's own jobs report as
          # check runs against the same commit, so waiting on "everything" would mean waiting on
          # `Windows installer` and `Linux bundles` -- which are waiting on this job. That
          # deadlocks until the six-hour job timeout. `running-workflow-name` does not prevent it:
          # it drops check runs whose *name* equals the string, so it excludes this one job and
          # leaves the builds in the set.
          #
          # Keep this in step with the `name:` of every job in ci.yml. The step below asserts the
          # count, because this filter only selects: a renamed job would silently fall out of the
          # allowlist and stop gating anything.
          check-regexp: ^(Rust|Rust \(Windows\)|Frontend|Packaging)$
          # `success` only. The default admits `skipped`, which would let a CI job that never ran
          # stand in for one that passed.
          allowed-conclusions: success
          wait-interval: 20
          # A tag pushed at a commit with no CI at all fails here rather than building. Checks are
          # created a moment after the push, so give discovery longer than its 60s default.
          checks-discovery-timeout: 300

      # The build jobs restore what release-cache.yml saves when main moves. A tag pushed right
      # behind main would otherwise start building before those caches exist and compile
      # everything from scratch. This waits for the warm-up to finish, not to pass: a failed
      # warm-up only means a slower release. A tag on a commit main never saw (an RC cut from dev)
      # has no warm-up at all, so the step gives up after discovery and the release goes on.
      - name: Wait for the release caches to be warmed
        continue-on-error: true
        uses: lewagon/wait-on-check-action@2271c86c146b96545b4e871b855e10ffa6f50773 # v1.9.0
        with:
          ref: ${{ github.sha }}
          repo-token: ${{ secrets.GITHUB_TOKEN }}
          check-regexp: ^Warm release cache
          allowed-conclusions: success,failure,cancelled,skipped,timed_out
          wait-interval: 20
          checks-discovery-timeout: 60

      # The step above proves every check it *matched* passed. It cannot notice one that stopped
      # matching -- it fails only when the filtered set is entirely empty. Rename `Frontend` to
      # `Web` and the gate quietly waits on three jobs instead of four, and a release ships with a
      # frontend nothing checked. This is the only thing that would say so.
      - name: CI gated on every job it should have
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          expected=4
          found=$(gh api "repos/${GITHUB_REPOSITORY}/commits/${GITHUB_SHA}/check-runs" \
            --paginate --jq '.check_runs[]
              | select(.name | test("^(Rust|Rust \\(Windows\\)|Frontend|Packaging)$"))
              | select(.conclusion == "success")
              | .name' | sort -u | wc -l)
          if [ "$found" -ne "$expected" ]; then
            echo "gated on $found CI jobs, expected $expected -- was a job in ci.yml renamed?" >&2
            exit 1
          fi
          echo "gated on all $expected CI jobs"

      # `check-versions.sh` proves the five in-tree version declarations agree with each other.
      # Nothing has ever proved they agree with the tag being built, because only this workflow
      # knows the tag -- so `v0.5.3` could quietly produce artifacts labelled 0.5.2. Same failure
      # that script exists to catch, one level up.
      - name: The tag names the version being built
        run: |
          ./scripts/check-versions.sh
          # A pre-release tag carries a suffix the manifests cannot hold -- `v0.5.4-rc1` is built
          # from workspace version 0.5.4 -- so compare the part before the first `-`.
          tag=${GITHUB_REF_NAME#v}
          tag=${tag%%-*}
          version=$(sed -n 's/^version = "\(.*\)"$/\1/p' Cargo.toml | head -1)
          if [ "$tag" != "$version" ]; then
            echo "tag $GITHUB_REF_NAME does not name workspace version $version" >&2
            exit 1
          fi
          echo "tag $GITHUB_REF_NAME matches version $version"

  windows:
    name: Windows installer
    needs: gate
    # Branch `workflow_dispatch` runs skip these entirely: the signing key must
    # never meet attacker-influenced build code. Scratch-tag verification uses
    # real tags (`vX.Y.Z-updater.N`), never branches.
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: windows-latest
    # Signing secrets come from the `release` environment, never the repo scope,
    # and only tag builds reach these jobs (see the gate). Branch
    # `workflow_dispatch` runs never see the private key.
    environment: release
    # Only the `release` job writes anything. These three build from a shared cache, so the
    # narrower token is worth the two lines.
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v5

      # The installer ships its own Tesseract, downloaded and proven to run by this script. The
      # runner needs no separate copy: the only thing that wanted one was the test suite, and the
      # tests now run in CI.
      - name: Vendor tesseract for the bundle
        run: ./scripts/vendor-windows-tesseract.ps1
        shell: pwsh

      # Reads the release-profile build release-cache.yml saved when main moved. CI's caches hold
      # debug builds, nothing in which a release build can reuse. Release only ever consumes: a
      # cache saved on a tag ref is scoped to that tag, so no later release could read it, and
      # writing a gigabyte nothing will read costs a minute of post-job every time.
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: release-windows
          save-if: false

      - uses: pnpm/action-setup@v5
        with:
          package_json_file: app/package.json

      - uses: actions/setup-node@v5
        with:
          node-version-file: app/.node-version
          cache: pnpm
          cache-dependency-path: app/pnpm-lock.yaml

      - run: pnpm install --frozen-lockfile
        working-directory: app

      - run: pnpm tauri build
        working-directory: app
        env:
          # A pre-release tag (`v0.4.2-rc1`) builds with debug assertions on, which is what makes
          # the `[DEBUG-…]` tracing exist at all -- every one of those lines is
          # `cfg(debug_assertions)`, so a normal release binary handed to a tester reports nothing
          # when something goes wrong. Stable tags are unaffected: `-` in the tag is the whole
          # switch.
          #
          # Set on the step rather than the workflow because `rust-cache` hashes every `CARGO*`
          # variable into its key. At workflow scope it reaches the cache action too, and the
          # resulting hash cannot match CI's -- which is why this job missed its cache even though
          # its key prefix already agreed.
          CARGO_PROFILE_RELEASE_DEBUG_ASSERTIONS: ${{ contains(github.ref_name, '-') }}
          # Bakes the updater channel into the binary (beta comparator for `-rc` tags).
          TENNOSCOPE_CHANNEL: ${{ contains(github.ref_name, '-') && 'beta' || 'stable' }}
          # Signs the updater artifacts (`.sig` next to every bundle). The key has no
          # password today, so this is empty -- and it must stay in lockstep with the
          # re-sign step below: the day the key gains a password, both variables change
          # together or the build fails (exit 6) on the password prompt rather than hanging.
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ''

      # The installer is unsigned: a code-signing certificate costs money this project does not
      # take. SmartScreen will warn on first run until the download builds reputation, which is
      # said in the release notes rather than left for the player to discover.
      - uses: actions/upload-artifact@v6
        with:
          name: windows-installer
          path: |
            target/release/bundle/nsis/*-setup.exe
            target/release/bundle/nsis/*.sig

  # The AppImage is its own job, and the only one still pinned to jammy.
  #
  # `code/check-libc.sh` in the catalog's own repo (AppImage/appimage.github.io#6700) opens the
  # submitted artifact and rejects it if any ELF in the AppDir references a GLIBC newer than the
  # oldest supported Ubuntu LTS -- jammy's 2.35. So this image has to be built on jammy: a 24.04
  # host bakes GLIBC_2.38/2.39 into the binary and into every library linuxdeploy bundles
  # next to it, and the loader refuses the lot on a 22.04 player's machine. Revisit when the
  # harness moves off jammy.
  #
  # Jammy's own pipewire cannot build this app's pipewire bindings, which is why the job builds
  # the pinned pipewire itself and why the installable packages left for 24.04. Built here, on
  # the jammy toolchain, what linuxdeploy bundles therefore still references nothing past
  # glibc 2.35 -- which is the whole point of the split.
  appimage:
    needs: gate
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-22.04
    # Same secret scoping as the Windows job above. `createUpdaterArtifacts` signs every bundle
    # Tauri produces, so the AppImage's `.sig` can only be made here.
    environment: release
    # Only the `release` job writes anything. These three build from a shared cache, so the
    # narrower token is worth the two lines.
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v5

      # Everything but pipewire. Jammy's is 0.3.48, which predates `spa_meta_bitmap_is_valid`
      # becoming an inline function (pipewire 853c4783), and the libspa bindings this app
      # compiles against assume it is one. The pinned pipewire below installs
      # `libspa-0.2.pc`/`libpipewire-0.3.pc` into a private prefix, and the distro's stale copy
      # has to go: pkg-config would otherwise find it there (it drags `libspa-0.2-dev` in behind
      # it), and it is the copy the loader would answer with when linuxdeploy bundles. `rpm`
      # was the rpm bundle's inspector and this job builds only the AppImage. `gettext` is
      # pipewire's, not the app's: `subdir('po')` is not optional and needs msgfmt at configure
      # time.
      - name: Install system dependencies
        uses: ./.github/actions/apt-install
        with:
          packages: >-
            libwebkit2gtk-4.1-dev
            libgtk-3-dev
            libayatana-appindicator3-dev
            librsvg2-dev
            libxdo-dev
            libssl-dev
            libclang-dev
            libgbm-dev
            libegl-dev
            libwayland-dev
            libxcb1-dev
            libarchive-tools
            meson
            ninja-build
            gettext
            tesseract-ocr
            tesseract-ocr-eng

      # Restored from the cache release-cache.yml saved on main. Not saved here: a cache saved on a
      # tag is readable by nothing but that tag.
      - name: Build the PipeWire client libraries
        uses: ./.github/actions/pipewire
        with:
          save: false

      - uses: Swatinem/rust-cache@v2
        with:
          # Saved by release-cache.yml on main. See the Windows job.
          shared-key: release-appimage
          save-if: false

      - uses: pnpm/action-setup@v5
        with:
          package_json_file: app/package.json

      - uses: actions/setup-node@v5
        with:
          node-version-file: app/.node-version
          cache: pnpm
          cache-dependency-path: app/pnpm-lock.yaml

      - run: pnpm install --frozen-lockfile
        working-directory: app

      # `--skip-gates` drops the test suite, clippy and `pnpm check` -- CI ran all three against
      # this commit and the gate job refused to get here until they passed. What the script still
      # does is the part CI cannot: it asserts the AppImage it just produced forces
      # `GDK_BACKEND=x11`, the property the reward overlay depends on, and repacks the AppDir.
      # That runs against the artifact users actually download. `appimage` is also the script's
      # default format, so naming it here changes nothing -- it is what a bare
      # `--skip-gates` would build, and what the packages job does not ask for.
      - run: ./scripts/build-linux-bundles.sh --skip-gates appimage
        env:
          # See the Windows job.
          CARGO_PROFILE_RELEASE_DEBUG_ASSERTIONS: ${{ contains(github.ref_name, '-') }}
          TENNOSCOPE_CHANNEL: ${{ contains(github.ref_name, '-') && 'beta' || 'stable' }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ''

      # The bundle helper repacks the AppImage AFTER `tauri build`, so the
      # build-time `.sig` covers pre-patch bytes. Re-sign the final file: a
      # stale signature would fail verification on every Linux self-update.
      # The CLI prompts for a key password when none is configured; with the empty
      # variable plus `< /dev/null` a future passworded key fails (exit 6) rather
      # than hanging the runner on a prompt.
      - name: Re-sign final AppImage
        working-directory: app
        run: |
          appimage=$(ls ../target/release/bundle/appimage/*.AppImage | grep -v '\.sig$' | head -1)
          pnpm tauri signer sign "$appimage" < /dev/null
          ls "$appimage.sig"
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ''

      # Only the AppImage: the whole artifact is what was repacked and re-signed above.
      # `upload-artifact` roots a multi-path artifact at the least common ancestor of its
      # globs, so with nothing else in the bundle directory this artifact is flat -- which
      # is the layout the `release` job's globs expect.
      - uses: actions/upload-artifact@v6
        with:
          name: linux-appimage
          path: |
            target/release/bundle/appimage/*.AppImage
            target/release/bundle/appimage/*.sig

  bundles:
    needs: gate
    if: startsWith(github.ref, 'refs/tags/v')
    # 24.04, not the jammy pin above: the deb and the rpm are installable packages, not
    # self-contained images. Tauri's Linux packages bundle no libraries of their own -- they
    # declare what they need (`libpipewire-0.3-0`, `pipewire-libs`, webkit, gtk) and the
    # player's system supplies it -- so nothing about them is tied to one libc floor, and this
    # is where the distro's own pipewire (1.0.5) is new enough to build the app's bindings.
    # What does move with the image is the binaries' own GLIBC requirement: built here they
    # need 2.39 rather than jammy's 2.35, so a 22.04 user needs the AppImage, not the deb.
    #
    # The split also makes an old packaging wrinkle visible: the deb still declares the jammy
    # package name `libpipewire-0.3-0` (app/src-tauri/tauri.conf.json, asserted by
    # `build-linux-bundles.sh`), and noble renamed that package `libpipewire-0.3-0t64`. So the
    # .deb built here satisfies its own `Depends` on 22.04 and Debian 12, where its binary no
    # longer runs, and satisfies it nowhere it does. Fixing that is a `deb.depends`/`rpm.depends`
    # change, not a runner change -- worth doing in the same commit as this split.
    runs-on: ubuntu-24.04
    # Same secret scoping as the Windows job above.
    environment: release
    # Only the `release` job writes anything. These three build from a shared cache, so the
    # narrower token is worth the two lines.
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v5

      - name: Install system dependencies
        uses: ./.github/actions/apt-install
        with:
          packages: >-
            libwebkit2gtk-4.1-dev
            libgtk-3-dev
            libayatana-appindicator3-dev
            librsvg2-dev
            libxdo-dev
            libssl-dev
            libpipewire-0.3-dev
            libclang-dev
            libgbm-dev
            libegl-dev
            libwayland-dev
            libxcb1-dev
            libarchive-tools
            rpm
            tesseract-ocr
            tesseract-ocr-eng

      - uses: Swatinem/rust-cache@v2
        with:
          # Saved by release-cache.yml on main. See the Windows job.
          shared-key: release-packages
          save-if: false

      - uses: pnpm/action-setup@v5
        with:
          package_json_file: app/package.json

      - uses: actions/setup-node@v5
        with:
          node-version-file: app/.node-version
          cache: pnpm
          cache-dependency-path: app/pnpm-lock.yaml

      - run: pnpm install --frozen-lockfile
        working-directory: app

      # `--skip-gates` drops the test suite, clippy and `pnpm check` -- CI ran all three against
      # this commit and the gate job refused to get here until they passed. What the script still
      # does is the part CI cannot: it asserts each package's metadata (one desktop entry, the
      # Exec the installed launcher needs, and the system pipewire dependency Tauri was
      # configured with) against the packages that were just built. `GDK_BACKEND=x11` and the
      # AppDir repack that used to share this step belong to the AppImage and are asserted in
      # the job above, against the AppImage.
      - run: ./scripts/build-linux-bundles.sh --skip-gates deb rpm
        env:
          # See the Windows job.
          CARGO_PROFILE_RELEASE_DEBUG_ASSERTIONS: ${{ contains(github.ref_name, '-') }}
          TENNOSCOPE_CHANNEL: ${{ contains(github.ref_name, '-') && 'beta' || 'stable' }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ''

      # `upload-artifact` roots a multi-path artifact at the least common ancestor of its globs
      # -- `target/release/bundle` -- so the per-format subdirectories survive the trip. The
      # `.sig` files Tauri writes beside these two bundles are not uploaded: the updater feed
      # only ever carries the AppImage and the Windows installer (see `build-update-feed.sh`).
      - uses: actions/upload-artifact@v6
        with:
          name: linux-bundles
          path: |
            target/release/bundle/deb/*.deb
            target/release/bundle/rpm/*.rpm

  # Publishing is its own job so the three builds can run at once. Previously the Linux job attached
  # the release, which forced it to wait for the Windows installer to exist -- an artifact
  # dependency that serialised two builds sharing no other reason to be ordered. The Linux halves
  # were one job until the AppImage needed jammy and the packages did not, so now it is three.
  release:
    name: Draft release
    needs: [windows, appimage, bundles]
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5

      - uses: actions/download-artifact@v7
        with:
          path: artifacts

      # Feeds are generated from the shipped `.sig` contents, never by hand --
      # and fail closed when a signature is missing or empty.
      - name: Build updater feeds
        run: |
          version=$(sed -n 's/^version = "\(.*\)"$/\1/p' Cargo.toml | head -1)
          ./scripts/build-update-feed.sh --version "$version" --tag "${{ github.ref_name }}" --artifacts artifacts --out feeds

      - name: Verify updater feeds
        run: |
          pip install --break-system-packages pynacl
          if [[ "${{ github.ref_name }}" == *"-"* ]]; then expect=beta; else expect=stable; fi
          ./scripts/verify-update-feed.sh --feeds feeds --artifacts artifacts --tauri-conf app/src-tauri/tauri.conf.json --expect "$expect"

      # A draft, not a publish. The release notes are written by hand from CHANGELOG.md and the
      # release goes out when the maintainer says so.
      - uses: softprops/action-gh-release@v3
        with:
          # Keep the user-facing title identifiable outside GitHub while spelling the version
          # exactly like the tag documented in RELEASING.md.
          name: TennoScope ${{ github.ref_name }}
          draft: true
          # Marked pre-release from the tag itself, so an `-rc`/`-beta` build cannot be presented
          # as stable by accident -- and those are exactly the builds with assertions left on.
          prerelease: ${{ contains(github.ref_name, '-') }}
          generate_release_notes: true
          fail_on_unmatched_files: true
          # `download-artifact` puts each artifact under a directory named after it, and
          # `upload-artifact` roots a multi-path artifact at the least common ancestor of its
          # globs. The two Linux jobs are separate, so the AppImage artifact is rooted at
          # `target/release/bundle/appimage` (flat, one format) while the packages artifact keeps
          # `target/release/bundle` and its per-format subdirectories.
          # `fail_on_unmatched_files` is what turns a wrong guess about that into a failed release
          # rather than a draft quietly missing the Linux downloads.
          files: |
            artifacts/linux-appimage/*.AppImage
            artifacts/linux-appimage/*.sig
            artifacts/linux-bundles/deb/*.deb
            artifacts/linux-bundles/rpm/*.rpm
            artifacts/windows-installer/*.exe
            artifacts/windows-installer/*.sig
            feeds/*.json

      # `releases/latest/download` serves only the newest stable release, so an RC's
      # own beta feed would never be seen there. Pin this tag's beta feed onto the
      # latest stable release instead: `latest/download/latest-beta.json` then serves
      # the fresh RC while `latest.json` stays untouched.
      - name: Serve RC feed from latest stable release
        if: contains(github.ref_name, '-')
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          stable_tag=$(gh release list --exclude-pre-releases --exclude-drafts --limit 1 --json tagName --jq '.[0].tagName')
          if [ -z "$stable_tag" ]; then
            echo "no stable release found; cannot serve the RC beta feed" >&2
            exit 1
          fi
          gh release upload "$stable_tag" feeds/latest-beta.json --clobber
