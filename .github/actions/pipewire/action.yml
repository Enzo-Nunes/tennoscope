name: Build the pinned PipeWire
description: >-
  Builds the PipeWire 1.0.0 client libraries into ~/pw/prefix, or restores them from the Actions
  cache, and points pkg-config and the loader at that prefix for every later step. For jammy
  runners only: see the comments below for why jammy's own PipeWire cannot be used.
inputs:
  save:
    description: Save the prefix to the cache after a miss. Tag runs pass false, since a cache saved on a tag is readable by nothing else.
    default: 'true'
runs:
  using: composite
  steps:
    # The prefix is a pure function of the pinned tarball and the configure line below, so it is
    # cached on both: a minute of meson per build for a result that never changes. Bump the `-v1`
    # when the configure line changes.
    - name: Restore the PipeWire build
      id: restore
      uses: actions/cache/restore@v5
      with:
        path: ~/pw/prefix
        key: pipewire-1.0.0-f91ef1d1-ubuntu22-v1

    # Jammy's PipeWire is 0.3.48, which predates `spa_meta_bitmap_is_valid` becoming an inline
    # function (pipewire 853c4783), and the libspa bindings this app compiles against assume it is
    # one. 1.0.0 is the oldest 1.x release, which buys two things: it is past that floor, and it
    # asks meson for >= 0.61.1, one jammy's own meson already satisfies -- so no pip toolchain has
    # to appear on the runner to build it. `auto_features=disabled` strips every `auto` dependency
    # (udev, sdl2, sndfile, alsa, bluez5, x11, vulkan, jack, avahi, libcamera ...). It does not
    # touch options that default to *enabled*, so those are disabled by hand: dbus pulls
    # libdbus-1-dev, flatpak pulls glib, and the jack/v4l2/alsa bridges build a library each that
    # nothing here will ever ship. `spa-plugins` must stay enabled -- disabling it makes configure
    # fail outright on an undefined `audioconvert_dep`.
    #
    # What is left is headers the app compiles against plus the one library it links: libspa
    # stopped shipping a `.so` once its last function became an inline one, so
    # `libpipewire-0.3.so.0` is all there is to bundle. The daemon and the tools still compile,
    # against nothing but libc. The caller installs meson, ninja-build and gettext (`subdir('po')`
    # is not optional and needs msgfmt at configure time).
    #
    # The tarball is pinned by digest: a release must not take a binary dependency from a URL that
    # changed underneath it, and this one is served by an upstream GitLab rather than a signed
    # distribution repository.
    - name: Build the PipeWire client libraries
      shell: bash
      env:
        PIPEWIRE_VERSION: '1.0.0'
        PIPEWIRE_SHA256: f91ef1d1161b37aae6e21b9671917d97097e2664c83d919ba3a0793d6fbc543d
        CACHED: ${{ steps.restore.outputs.cache-hit }}
      run: |
        set -eu
        if [ "$CACHED" = true ]; then
          echo "PipeWire ${PIPEWIRE_VERSION} restored from cache"
        else
          archive="/tmp/pipewire-${PIPEWIRE_VERSION}.tar.gz"
          curl --fail --location --retry 3 --output "$archive" \
            "https://gitlab.freedesktop.org/pipewire/pipewire/-/archive/${PIPEWIRE_VERSION}/pipewire-${PIPEWIRE_VERSION}.tar.gz"
          echo "${PIPEWIRE_SHA256}  $archive" | sha256sum --check
          tar --extract --gzip --file "$archive" --directory /tmp
          cd "/tmp/pipewire-${PIPEWIRE_VERSION}"
          meson setup build --prefix="$HOME/pw/prefix" \
            -Dauto_features=disabled \
            -Ddbus=disabled \
            -Dflatpak=disabled \
            -Dpipewire-alsa=disabled \
            -Dpipewire-jack=disabled \
            -Dpipewire-v4l2=disabled \
            -Dexamples=disabled \
            -Dtests=disabled \
            -Dman=disabled \
            -Ddocs=disabled \
            '-Dsession-managers=[]'
          meson compile -C build
          meson install -C build
          cd "$GITHUB_WORKSPACE"
        fi
        # Ubuntu's meson patches libdir to the multiarch directory, so do not hardcode
        # `lib/x86_64-linux-gnu`: ask the installed tree where it actually landed.
        pc_dir=$(dirname "$(find "$HOME/pw/prefix" -name 'libspa-0.2.pc' -print -quit)")
        [ -f "$pc_dir/libspa-0.2.pc" ] || {
          echo "no libspa-0.2.pc was installed into $HOME/pw/prefix" >&2
          exit 1
        }
        lib_dir=$(dirname "$pc_dir")
        # pkg-config reads PKG_CONFIG_PATH ahead of the system directories, so the linker and the
        # bindgen build scripts see the prefix's headers and libraries.
        echo "PKG_CONFIG_PATH=$lib_dir/pkgconfig:${PKG_CONFIG_PATH:-}" >>"$GITHUB_ENV"
        # The .pc files are versioned by ABI, not by release (`libspa-0.2.pc` says `Version: 0.2`
        # on jammy and on 1.0.0 alike), so `--modversion` cannot tell the two apart and only the
        # include path can. Cheap to check, and the alternative is a build against headers the
        # prefix was fetched to replace.
        cflags=$(PKG_CONFIG_PATH="$lib_dir/pkgconfig" pkg-config --cflags libspa-0.2)
        case "$cflags" in
          *"$HOME"/pw/prefix/*) ;;
          *) echo "libspa-0.2 resolves outside the pipewire prefix: $cflags" >&2; exit 1 ;;
        esac
        # linuxdeploy bundles whatever `ldd` resolves each NEEDED name to while it runs. Left to
        # itself the loader answers with the system 0.3.48 -- the very version the prefix exists to
        # replace -- so the AppImage would ship that `libpipewire-0.3.so.0` next to a binary
        # compiled against 1.0.0 headers.
        echo "LD_LIBRARY_PATH=$lib_dir:${LD_LIBRARY_PATH:-}" >>"$GITHUB_ENV"

    - name: Save the PipeWire build
      if: inputs.save == 'true' && steps.restore.outputs.cache-hit != 'true'
      uses: actions/cache/save@v5
      with:
        path: ~/pw/prefix
        key: pipewire-1.0.0-f91ef1d1-ubuntu22-v1
